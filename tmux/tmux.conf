# tmux (linked to ~/.config/tmux/tmux.conf by install.sh)

# Prefix: Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Terminal: truecolor, OSC52 clipboard (also works over SSH), fast Esc for nvim
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"
set -g set-clipboard on
set -g escape-time 10
set -g focus-events on

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off # closing a session switches to another one instead of detaching
setw -g mode-keys vi

# Splits match nvim: | vertical, \ horizontal
bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# prefix f: project picker (sesh). Lists tmux sessions and zoxide dirs; picking a dir creates its session.
# In the picker: ^a all, ^t tmux sessions, ^x zoxide dirs, ^f find dirs under ~/git, ^d kill session
bind f run-shell "sesh connect \"$(sesh list --icons | fzf-tmux -p 80%,70% \
  --no-sort --ansi --border-label ' sesh ' --prompt '> ' \
  --header '^a all  ^t tmux  ^x zoxide  ^f find  ^d kill' \
  --bind 'tab:down,btab:up' \
  --bind 'ctrl-a:change-prompt(> )+reload(sesh list --icons)' \
  --bind 'ctrl-t:change-prompt(tmux> )+reload(sesh list -t --icons)' \
  --bind 'ctrl-x:change-prompt(zoxide> )+reload(sesh list -z --icons)' \
  --bind 'ctrl-f:change-prompt(find> )+reload(fd -H -d 3 -t d -E .git . ~/git)' \
  --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(> )+reload(sesh list --icons)' \
  --preview-window 'right:55%' --preview 'sesh preview {}')\""
# prefix L: back to the previous session
bind L run-shell "sesh last"

# Copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# smart-splits.nvim: Ctrl-hjkl moves and Ctrl-arrows resize across nvim splits and tmux panes
bind -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'
bind -n C-Left  if -F "#{@pane-is-vim}" 'send-keys C-Left'  'resize-pane -L 3'
bind -n C-Down  if -F "#{@pane-is-vim}" 'send-keys C-Down'  'resize-pane -D 3'
bind -n C-Up    if -F "#{@pane-is-vim}" 'send-keys C-Up'    'resize-pane -U 3'
bind -n C-Right if -F "#{@pane-is-vim}" 'send-keys C-Right' 'resize-pane -R 3'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# Ctrl-l is taken by pane navigation; prefix Ctrl-l clears the screen
bind C-l send-keys C-l

# Status line
set -g status-position top
set -g status-style "bg=default,fg=colour245"
set -g status-left "#[bold]#S #[default]"
set -g status-right "#h"
setw -g window-status-current-style "fg=colour39,bold"
