# AeroSpace tiling window manager config.
# Docs: https://nikitabobko.github.io/AeroSpace/guide

# Config version for compatibility/deprecations. See guide#config-version.
config-version = 2

# Start AeroSpace at login.
start-at-login = true

# Normalization tweaks AeroSpace performs when you open/close/move windows.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Pin workspaces 1-3 to monitors 1-3, by physical left-to-right position
# (`aerospace list-monitors` shows current index/name mapping). Workspaces 4-9
# are deliberately left unassigned so 'summon-workspace' can place them on
# whichever monitor is focused at the time (see mode.main.binding below).
[workspace-to-monitor-force-assignment]
1 = 1
2 = 2
3 = 3

# Keep workspaces 1-9 alive even when empty/invisible (config-version = 1 inferred
# this from keybinding right-hand sides; version 2 requires it explicitly, since
# these are the only workspaces referenced in mode.main.binding below).
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']

# Gaps between windows/monitor edges.
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8

# Default layout for new windows.
[mode.main.binding]
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# Focus windows.
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move windows.
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize windows.
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Join/split.
alt-f = 'fullscreen'

# Workspaces 1-3 are pinned to monitors 1-3 (see workspace-to-monitor-force-assignment
# below), so these always jump to their home monitor.
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'

# Workspaces 4-9 are unpinned. 'summon-workspace' (unlike 'workspace') pulls the
# workspace onto whichever monitor is currently focused, so these act as a free
# pool you can spawn/grab on the active monitor, Hyprland-style.
alt-4 = 'summon-workspace 4'
alt-5 = 'summon-workspace 5'
alt-6 = 'summon-workspace 6'
alt-7 = 'summon-workspace 7'
alt-8 = 'summon-workspace 8'
alt-9 = 'summon-workspace 9'

# Move focused window to workspace 1-9.
alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# Reload config.
alt-shift-c = 'reload-config'

# Enter service mode for less-frequent commands (e.g. alt-shift-semicolon; then r to reset layout).
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
